buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.6.1"
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.24"
}

apply plugin: 'java'

group = 'club.hellin'
version = '1.1.14-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack.io"
        url = "https://jitpack.io"
    }
    maven { url "https://repo.codemc.org/repository/maven-public/" }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = "fancyinnovations"
        url = "https://repo.fancyinnovations.com/releases"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.129-stable")
    paperweight.paperDevBundle("26.2.build.129-stable")
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    implementation "de.tr7zw:item-nbt-api:2.16.1"
    implementation files("C:\\Users\\josep\\Desktop\\Minigames\\drink\\target\\drink-1.0.5-shaded.jar")
    implementation("de.exlll:configlib-paper:4.8.1")
    compileOnly "com.github.decentsoftware-eu:decentholograms:2.10.1"
    compileOnly("de.oliver:FancyHolograms:2.10.0") { transitive = false }
    implementation group: 'org.json', name: 'json', version: '20240303'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    implementation 'com.github.Metaphoriker.pathetic:pathetic-bukkit:4.0.1'
    implementation "commons-codec:commons-codec:1.15"
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.22.3'
}

jar {
    manifest {
        attributes('paperweight-mappings-namespace': 'mojang') // Stops 1.21.11 Paper from remapping the jar
    }
}

shadowJar {
    manifest {
        attributes('paperweight-mappings-namespace': 'mojang')
    }


    relocate 'de.tr7zw.changeme.nbtapi', 'club.hellin.forceblocks.de.tr7zw.3_0_0.nbtapi'

    minimize()
}

def targetJavaVersion = 21 // 1.21.11 servers can still run on Java 21
def compileJavaVersion = 25 // 26.x Paper jars need JDK 25 to compile against
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    disableAutoTargetJvm()
    if (JavaVersion.current() < JavaVersion.toVersion(compileJavaVersion)) {
        toolchain.languageVersion.set(JavaLanguageVersion.of(compileJavaVersion))
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
